name: Deploy Context Platform Landing Page to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/landing/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage Context Platform Landing Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload landing artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing

      - name: Write deployment summary
        run: |
          {
            echo "### GitHub Pages Landing Deployment Summary"
            echo "- **Context Platform Landing**: https://dellik95.github.io/context-platform/"
            echo "- **Source Directory**: \`docs/landing/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

# First CI pass for this repo (no hosting platform was previously configured for it —
# see docs/architecture/ARCHITECTURE_ASSESSMENT.md, BACKLOG-17 / IDX-1). Keep this minimal:
# build + test only. No deploy, no image publishing — that is separate future work.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DASHBOARD_DIR: apps/host/Context.Dashboard/context.dashboard.client

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Context.Dashboard.Server.csproj embeds the Angular dashboard into wwwroot/ as part of its
      # own `dotnet build` (see apps/host/Context.Dashboard/Context.Dashboard.Server/Context.Dashboard.Server.csproj,
      # target "BuildDashboard"), shelling out to `npm ci` / `npx ng build` in
      # apps/host/Context.Dashboard/context.dashboard.client. Node must be available and
      # dependencies installed before the .NET build runs, or that MSBuild target fails.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.DASHBOARD_DIR }}/package-lock.json

      - name: Install dashboard dependencies
        working-directory: ${{ env.DASHBOARD_DIR }}
        run: npm ci

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore ContextPlatform.slnx

      - name: Build
        run: dotnet build ContextPlatform.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ContextPlatform.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 7

  dashboard:
    name: Dashboard build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/host/Context.Dashboard/context.dashboard.client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/host/Context.Dashboard/context.dashboard.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No ESLint (or other lint) configuration exists in apps/dashboard yet, so there is
      # nothing to wire up here. Add a "lint" script + lint step once a linter is adopted.
      - name: Test
        run: npm test -- --watch=false

  docker:
    name: Container image build
    runs-on: ubuntu-latest
    # The Dockerfile has its own restore/publish path that neither job above exercises, so a
    # csproj/global.json change can break the deployable image while both stay green. Build only —
    # nothing is pushed anywhere.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

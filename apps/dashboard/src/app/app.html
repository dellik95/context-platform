<mat-toolbar color="primary" class="shell-toolbar">
  <a routerLink="/projects" class="brand">
    <mat-icon>hub</mat-icon>
    <span>Context Platform</span>
  </a>
  <span class="spacer"></span>
  @if (health(); as h) {
    <span
      class="health-pill"
      [class.healthy]="h.healthy"
      [matTooltip]="'DB: ' + h.databaseReachable + ' · embeddings: ' + h.embeddingProvider + ' · reranker: ' + h.rerankerProvider + ' · llm: ' + h.llmProvider"
    >
      <mat-icon>{{ h.healthy ? 'check_circle' : 'error' }}</mat-icon>
      {{ h.healthy ? 'Healthy' : 'Degraded' }}
    </span>
  } @else if (healthError()) {
    <span class="health-pill">
      <mat-icon>cloud_off</mat-icon>
      Host unreachable
    </span>
  }
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>

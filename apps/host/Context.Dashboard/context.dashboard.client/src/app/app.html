<div class="flex min-h-screen flex-col bg-gradient-to-b from-slate-50 via-slate-50 to-indigo-50/30 text-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
      <a
        routerLink="/projects"
        class="brand flex min-w-0 items-center gap-2.5 text-slate-900 no-underline transition hover:opacity-85"
      >
        <span
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-xs"
        >
          <app-icon name="hub" sizeClass="w-4 h-4" />
        </span>
        <span class="truncate text-sm font-semibold tracking-tight sm:text-base">Context Platform</span>
      </a>

      @if (health(); as h) {
        <span
          class="inline-flex shrink-0 items-center gap-2 rounded-full px-3 py-1 text-xs font-medium ring-1 ring-inset transition"
          [class]="
            h.healthy
              ? 'bg-emerald-50/90 text-emerald-700 ring-emerald-200'
              : 'bg-amber-50/90 text-amber-800 ring-amber-200'
          "
          [title]="
            'DB: ' +
            h.databaseReachable +
            ' · embeddings: ' +
            h.embeddingProvider +
            ' · reranker: ' +
            h.rerankerProvider +
            ' · llm: ' +
            h.llmProvider
          "
        >
          <span
            class="h-2 w-2 shrink-0 rounded-full"
            [class]="h.healthy ? 'bg-emerald-500' : 'bg-amber-500'"
          ></span>
          <span class="hidden sm:inline">
            {{ h.healthy ? 'Healthy' : 'Degraded' }} · {{ h.embeddingProvider }} / {{ h.llmProvider }}
          </span>
          <span class="sm:hidden">
            {{ h.healthy ? 'Healthy' : 'Degraded' }}
          </span>
        </span>
      } @else if (healthError()) {
        <span
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-rose-50 px-3 py-1 text-xs font-medium text-rose-700 ring-1 ring-inset ring-rose-200"
        >
          <span class="h-2 w-2 rounded-full bg-rose-500"></span>
          Host unreachable
        </span>
      }
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <app-confirm-dialog-host />
  <app-toast-container />
</div>

<div class="flex flex-col">
  <div class="sticky top-14 z-20 border-b border-slate-200/90 bg-white/95 backdrop-blur-md">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3 pt-3.5 pb-2">
        <a
          routerLink="/projects"
          class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          title="All projects"
          aria-label="Back to projects"
        >
          <app-icon name="arrow-back" sizeClass="w-4 h-4" />
        </a>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-base font-semibold text-slate-900 sm:text-xl">
            {{ ctx.projectName() || 'Loading…' }}
          </h1>
          @if (ctx.status()?.project?.rootPath; as rootPath) {
            <p class="truncate font-mono text-[11px] text-slate-500 sm:text-xs">{{ rootPath }}</p>
          }
        </div>
      </div>

      <nav class="-mx-1 -mb-px flex gap-1 overflow-x-auto px-1 pb-0.5" aria-label="Project sections">
        @for (tab of tabs; track tab.route) {
          <a
            [routerLink]="tab.route"
            routerLinkActive="border-indigo-600 text-indigo-700 bg-indigo-50/50"
            #rla="routerLinkActive"
            [class]="
              'inline-flex shrink-0 items-center gap-1.5 rounded-t-lg border-b-2 px-3 py-2 text-xs font-medium whitespace-nowrap transition sm:py-2.5 sm:text-sm ' +
              (rla.isActive
                ? 'border-indigo-600 bg-indigo-50/50 text-indigo-700'
                : 'border-transparent text-slate-600 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-900')
            "
          >
            <app-icon [name]="tab.icon" sizeClass="w-4 h-4" />
            <span>{{ tab.label }}</span>
          </a>
        }
      </nav>
    </div>

    @if (busy()) {
      <app-progress-bar />
    }
  </div>

  <div class="mx-auto w-full max-w-6xl min-w-0 flex-1 px-4 py-6 sm:px-6 lg:px-8">
    @if (ctx.projectId()) {
      <router-outlet />
    }
  </div>
</div>

services:
  context-platform:
    build: .
    image: context-platform:local
    restart: unless-stopped
    # Loopback-only publish keeps the exact same effective security boundary as the bare-metal
    # default (Kestrel binds 0.0.0.0 *inside* the container only because loopback there would be
    # unreachable from outside it — see ContextHostOptions.BindHost's remarks) — nothing beyond
    # this machine can ever reach it.
    ports:
      - "127.0.0.1:${CONTEXT_PLATFORM_PORT:-47923}:47923"
    environment:
      CONTEXT_PLATFORM_PORT: "47923"
      # Uncomment to point at a local Ollama install on the HOST (not this container) —
      # host.docker.internal is the Docker Desktop/Rancher Desktop DNS name that reaches it from
      # inside a container ("localhost" here would mean the container itself). Verified working
      # end-to-end bare-metal (dotnet run, no container) on this machine; reaching it from INSIDE
      # a container additionally needs the host's firewall to allow inbound to Ollama's port from
      # the container's virtual network, which is host/VM-backend-specific (e.g. an explicit
      # Windows Firewall block rule on ollama.exe was the blocker here) — if health still reports
      # embeddingProvider/llmProvider "ollama" but every search/session-end request 500s with
      # "Connection refused", that firewall path is still the first thing to check, not this config.
      # OllamaHostFallbackHandler (src/Context.Providers/OllamaHostFallbackHandler.cs) now softens the rest of
      # this: when running in a container it detects that (via /.dockerenv) and, if the FIRST
      # connection attempt to CONTEXT_OLLAMA_BASE_URL fails at the connection level (refused/
      # unreachable/timeout — not a real HTTP error response from Ollama), automatically retries a
      # couple of well-known fallback hosts (host.docker.internal, then 172.17.0.1, the default
      # Docker bridge gateway on plain Linux Docker Engine) before giving up, and logs (Warning
      # level) which candidate ultimately worked or that all of them failed. That's a genuine
      # improvement for hosts/backends where one of those alternates happens to be reachable, but
      # it is NOT a fix for a host-side firewall actively blocking the connection — on THIS
      # machine's Rancher-Desktop-on-Windows setup, disabling the Windows Firewall block rule on
      # ollama.exe was still not enough to make the container path work end-to-end, so bare-metal
      # (dotnet run, no container) remains the only verified-working path for local Ollama here.
      # See ROADMAP.md's "Docker container → host Ollama networking" entry for the full status.
      # Model choice: embeddinggemma is a purpose-built embedding model (much better fit than
      # repurposing a chat model for this); qwen2.5-coder:7b is the balance of quality vs. latency
      # for summarization/memory-extraction background jobs — gemma4:26b (if pulled) is higher
      # quality but meaningfully slower per call.
      # CONTEXT_EMBEDDING_PROVIDER: ollama
      # CONTEXT_LLM_PROVIDER: ollama
      # CONTEXT_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # CONTEXT_OLLAMA_EMBEDDING_MODEL: embeddinggemma
      # CONTEXT_OLLAMA_CHAT_MODEL: qwen2.5-coder:7b
      # Uncomment to use hosted providers instead:
      # CONTEXT_EMBEDDING_PROVIDER: openai
      # CONTEXT_LLM_PROVIDER: anthropic
      # CONTEXT_OPENAI_API_KEY: ${CONTEXT_OPENAI_API_KEY}
      # CONTEXT_ANTHROPIC_API_KEY: ${CONTEXT_ANTHROPIC_API_KEY}
    extra_hosts:
      # Needed only when CONTEXT_OLLAMA_BASE_URL (or any other host.docker.internal reference)
      # above is enabled; harmless no-op otherwise. Guarantees the name resolves even on plain
      # Linux Docker Engine, where Docker Desktop/Rancher Desktop's automatic alias isn't present.
      - "host.docker.internal:host-gateway"
    volumes:
      # Defaults to this repo itself — dogfooding Context Platform on its own codebase. Point
      # HOST_PROJECT_PATH (env var or a .env file) at any other repo to index that one instead.
      - "${HOST_PROJECT_PATH:-.}:/workspace"
